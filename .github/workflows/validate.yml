name: Validate Smart Taskbar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Official community validation
        run: |
          git init /tmp/smart-taskbar-validator
          git -C /tmp/smart-taskbar-validator fetch --depth 1 https://github.com/noctalia-dev/official-plugins.git 99a892dc9cb3490634412701c45acd024fe0383b
          git -C /tmp/smart-taskbar-validator checkout --detach FETCH_HEAD
          validator=/tmp/smart-taskbar-validator/.github/actions/validate-plugins
          python3 -m pip install -r "$validator/requirements.txt"
          python3 -m unittest discover -s "$validator" -p test_validate_plugins.py
          python3 "$validator/validate-plugins.py" --profile community --root "$GITHUB_WORKSPACE"
      - name: Build official Luau CLI
        run: |
          git init /tmp/luau
          git -C /tmp/luau fetch --depth 1 https://github.com/luau-lang/luau.git f46d879e28302a430029304f7f6a162aed66f103
          git -C /tmp/luau checkout --detach FETCH_HEAD
          make -C /tmp/luau config=release luau luau-compile -j2
      - name: Source compilation and executable fixture tests
        run: |
          /tmp/luau/luau-compile --null smart-taskbar/widget.luau smart-taskbar/lib/model.luau smart-taskbar/lib/compositor.luau
          LUAU=/tmp/luau/luau python3 tests/run.py
          python3 scripts/check.py
